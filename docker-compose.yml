# Local-only development database; credentials must be supplied through .env.
# Production: use docker-compose.stack.yml with explicit POSTGRES_PASSWORD and JWT_SECRET.
services:
  classpage-db:
    image: postgres:16-alpine
    container_name: classpage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: classpage
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env before starting the local database}
      POSTGRES_DB: classpage
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - classpage_pg_data:/var/lib/postgresql/data
      - ./database/init.postgresql.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

volumes:
  classpage_pg_data:
