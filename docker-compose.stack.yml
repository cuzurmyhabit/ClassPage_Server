# 웹(nginx+정적) + Nest API + PostgreSQL 한 VM에서 한 번에
#
#   Parent/
#     ClassPage_Server/    ← 여기서 docker compose 실행
#     ClassPage_Client/
#
# 1) deploy/stack.env.example 을 deploy/stack.env 로 복사 후 값 수정
# 2) ClassPage_Server 디렉터리에서:
#    docker compose -f docker-compose.stack.yml --env-file deploy/stack.env up -d --build
#
# 브라우저: http://공인IP:포트/  (기본 HTTP_PORT=80)

services:
  db:
    image: postgres:16-alpine
    container_name: classpage-stack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: classpage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-classpage1234}
      POSTGRES_DB: classpage
    volumes:
      - classpage_stack_pg:/var/lib/postgresql/data
      - ./database/init.postgresql.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U classpage -d classpage']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: classpage-stack-api
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: classpage
      DB_PASSWORD: ${POSTGRES_PASSWORD:-classpage1234}
      DB_DATABASE: classpage
      DB_SYNC: 'false'
      API_PREFIX: api
      JWT_SECRET: ${JWT_SECRET:?deploy/stack.env 에 JWT_SECRET 을 설정하세요}
      NEIS_API_KEY: ${NEIS_API_KEY:-}
      NEIS_OFFICE_CODE: ${NEIS_OFFICE_CODE:-}
      NEIS_SCHOOL_CODE: ${NEIS_SCHOOL_CODE:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - '3000'

  web:
    build:
      context: ..
      dockerfile: ClassPage_Server/docker/Dockerfile.web
    container_name: classpage-stack-web
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
    depends_on:
      - api

volumes:
  classpage_stack_pg:
